<h3 class="gac-subhead gac-first" i18n>Select your preferred library card design.</h3>
<p class="gac-help" i18n>You'll receive one wallet-size and one keychain-size card.</p>

<div class="gac-cards" role="radiogroup" aria-label="Card Design" i18n-aria-label>
  <button type="button" class="gac-card-tile" role="radio"
      *ngFor="let card of cardOptions"
      [attr.aria-checked]="state.cardDesign === card"
      [class.gac-card-tile-selected]="state.cardDesign === card"
      (click)="chooseDesign(card)">
    <span class="material-icons gac-card-check" aria-hidden="true"
        *ngIf="state.cardDesign === card">check_circle</span>
    <img [src]="cardOptionUrl(card)" [alt]="cardDescription(card)"/>
    <span class="gac-card-desc">{{cardDescription(card)}}</span>
  </button>
</div>

<p class="gac-note">
  <a href="https://kcls.org/library-card-artists/" i18n>
    Learn about the artists who created these new designs.
  </a>
</p>

<h3 class="gac-subhead" i18n>How would you like to receive your All-Access Library Card?</h3>

<div class="gac-choices" role="radiogroup"
    aria-label="How would you like to receive your All-Access Library Card?"
    i18n-aria-label>

  <button type="button" class="gac-choice" role="radio"
      [attr.aria-checked]="state.delivery === 'Pick up'"
      [class.gac-choice-selected]="state.delivery === 'Pick up'"
      (click)="chooseDelivery('Pick up')">
    <span class="material-icons gac-choice-icon" aria-hidden="true">storefront</span>
    <span class="gac-choice-lines">
      <span class="gac-choice-label" i18n>Pickup at my local branch</span>
      <span class="gac-choice-sub"><ng-container i18n>(Available now.)</ng-container>
        <b *ngIf="state.homeOrgName" class="gac-choice-org">{{state.homeOrgName}}</b></span>
    </span>
    <span class="material-icons gac-choice-check" aria-hidden="true"
        *ngIf="state.delivery === 'Pick up'">check_circle</span>
  </button>

  <button type="button" class="gac-choice" role="radio"
      [attr.aria-checked]="state.delivery === 'Mail'"
      [class.gac-choice-selected]="state.delivery === 'Mail'"
      (click)="chooseDelivery('Mail')">
    <span class="material-icons gac-choice-icon" aria-hidden="true">mail</span>
    <span class="gac-choice-lines">
      <span class="gac-choice-label" i18n>By mail</span>
      <span class="gac-choice-sub" i18n>(Wait 1-2 weeks for your card to be mailed to your home address.)</span>
    </span>
    <span class="material-icons gac-choice-check" aria-hidden="true"
        *ngIf="state.delivery === 'Mail'">check_circle</span>
  </button>

</div>
